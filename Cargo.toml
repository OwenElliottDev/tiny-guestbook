[package]
name = "guestbook"
version = "0.1.1"
edition = "2024"

[dependencies]
actix-files = "0.6.10"
actix-web = "4.12.1"
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "macros",
  "uuid"
] }
subtle = "2.6.1"
uuid = { version = "1.21.0", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
