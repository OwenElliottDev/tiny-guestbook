[package]
name = "guestbook"
version = "0.2.0"
edition = "2024"

[dependencies]
actix-files = "0.7.2"
actix-web = "4.18.1"
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "uuid"
] }
subtle = "2.6.1"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
