[package]
name = "guestbook"
version = "0.1.2"
edition = "2024"

[dependencies]
actix-files = "0.7.0"
actix-web = "4.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "uuid"
] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"